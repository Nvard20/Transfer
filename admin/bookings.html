<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arev Transfer</title>
    <link rel="stylesheet" href="../assets/css/site.css?v=2">
    <link rel="stylesheet" href="../assets/css/panel.css?v=2">
</head>
<body data-layout="admin" data-root="../" data-page="bookings" data-title="bookings" data-nav="bookings">
    <main>
        <form class="card filter-bar" method="get">
            <div class="field">
                <label for="fFrom" data-i18n="dateFrom"></label>
                <input type="date" id="fFrom" name="from">
            </div>
            <div class="field">
                <label for="fTo" data-i18n="dateTo"></label>
                <input type="date" id="fTo" name="to">
            </div>
            <div class="field">
                <label for="fStatus" data-i18n="status"></label>
                <select id="fStatus" name="status"></select>
            </div>
            <div class="field field-grow">
                <label for="fSearch" data-i18n="search"></label>
                <input type="search" id="fSearch" name="q" data-i18n-placeholder="searchPlaceholder">
            </div>
            <div class="filter-actions">
                <button type="submit" class="btn btn-primary" data-i18n="filter"></button>
                <a class="btn btn-ghost" href="bookings.html" data-i18n="reset"></a>
            </div>
        </form>

        <section class="card panel-card">
            <div class="panel-card-head">
                <h2 id="foundCount"></h2>
            </div>
            <div id="bookingsTable"></div>
        </section>
    </main>

    <script src="../assets/js/i18n.js?v=2"></script>
    <script src="../assets/js/data.js?v=2"></script>
    <script src="../assets/js/app.js?v=2"></script>
    <script src="../assets/js/pages.js?v=2"></script>
</body>
</html>
