<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arev Transfer</title>
    <link rel="stylesheet" href="../assets/css/site.css?v=5">
    <link rel="stylesheet" href="../assets/css/panel.css?v=5">
</head>
<body data-layout="admin" data-root="../" data-page="tariff" data-title="tariffs" data-nav="tariffs">
    <main>
        <a class="link-back" id="backLink" href="tariffs.html">← <span data-i18n="tariffs"></span></a>

        <form class="card form-card form-narrow" data-demo-form data-demo-message="demoSaved">
            <h2 id="formTitle"></h2>
            <div class="form-grid">
                <div class="field span-2" id="airportField">
                    <label for="airport" data-i18n="airport"></label>
                    <select id="airport"></select>
                </div>
                <div class="field" id="zoneField">
                    <label for="zone" data-i18n="zone"></label>
                    <select id="zone"></select>
                </div>
                <div class="field" id="tourField" hidden>
                    <label for="tourSelect" data-i18n="tour"></label>
                    <select id="tourSelect"></select>
                </div>
                <div class="field">
                    <label for="vehicle" data-i18n="vehicle"></label>
                    <select id="vehicle"></select>
                </div>
                <div class="field span-2">
                    <label for="price" id="priceLabel"></label>
                    <input type="number" id="price" min="0" step="500" required>
                </div>
            </div>
            <div class="form-actions">
                <a class="btn btn-ghost" id="cancelLink" href="tariffs.html" data-i18n="cancel"></a>
                <button type="submit" class="btn btn-primary" data-i18n="save"></button>
            </div>
        </form>
    </main>

    <script src="../assets/js/i18n.js?v=5"></script>
    <script src="../assets/js/data.js?v=5"></script>
    <script src="../assets/js/app.js?v=5"></script>
    <script src="../assets/js/pages.js?v=5"></script>
</body>
</html>
