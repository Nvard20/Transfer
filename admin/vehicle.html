<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arev Transfer</title>
    <link rel="stylesheet" href="../assets/css/site.css?v=3">
    <link rel="stylesheet" href="../assets/css/panel.css?v=3">
</head>
<body data-layout="admin" data-root="../" data-page="vehicle" data-title="vehicleTypes" data-nav="vehicles">
    <main>
        <a class="link-back" href="vehicles.html">← <span data-i18n="vehicleTypes"></span></a>

        <form class="card form-card form-narrow" data-demo-form data-demo-message="demoSaved">
            <h2 id="formTitle"></h2>
            <div class="form-grid">
                <div class="field span-2">
                    <label for="nameHy" data-i18n="nameHy"></label>
                    <input type="text" id="nameHy" required>
                </div>
                <div class="field">
                    <label for="nameEn" data-i18n="nameEn"></label>
                    <input type="text" id="nameEn" required>
                </div>
                <div class="field">
                    <label for="nameRu" data-i18n="nameRu"></label>
                    <input type="text" id="nameRu" required>
                </div>
                <div class="field">
                    <label for="pax" data-i18n="maxPassengers"></label>
                    <input type="number" id="pax" min="1" value="3" required>
                </div>
                <div class="field">
                    <label for="bags" data-i18n="maxLuggage"></label>
                    <input type="number" id="bags" min="0" value="3" required>
                </div>
                <div class="field span-2">
                    <label for="factor" data-i18n="priceFactor"></label>
                    <input type="number" id="factor" min="0.1" step="0.1" value="1" required>
                    <small class="hint" data-i18n="priceFactorHint"></small>
                </div>
            </div>
            <label class="checkbox">
                <input type="checkbox" id="isActive" checked>
                <span data-i18n="active"></span>
            </label>
            <div class="form-actions">
                <a class="btn btn-ghost" href="vehicles.html" data-i18n="cancel"></a>
                <button type="submit" class="btn btn-primary" data-i18n="save"></button>
            </div>
        </form>
    </main>

    <script src="../assets/js/i18n.js?v=3"></script>
    <script src="../assets/js/data.js?v=3"></script>
    <script src="../assets/js/app.js?v=3"></script>
    <script src="../assets/js/pages.js?v=3"></script>
</body>
</html>
