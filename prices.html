<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arev Transfer</title>
    <link rel="stylesheet" href="assets/css/site.css?v=3">
</head>
<body data-layout="public" data-page="prices" data-title="pricesTitle" data-nav="prices">
    <main>
        <section class="page-head">
            <div class="container">
                <h1 data-i18n="pricesTitle"></h1>
                <p class="lead" data-i18n="pricesLead"></p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="tabs" id="airportTabs"></div>
                <div class="card table-wrap" id="pricesTable"></div>
                <p class="muted small tour-note" id="tourNote" data-i18n="tourHint" hidden></p>

                <ul class="note-list">
                    <li data-i18n="priceNote1"></li>
                    <li data-i18n="priceNote2"></li>
                    <li data-i18n="priceNote3"></li>
                </ul>

                <a class="btn btn-accent" id="bookLink" href="booking.html" data-i18n="bookTransfer"></a>
            </div>
        </section>
    </main>

    <script src="assets/js/i18n.js?v=3"></script>
    <script src="assets/js/data.js?v=3"></script>
    <script src="assets/js/app.js?v=3"></script>
    <script src="assets/js/pages.js?v=3"></script>
</body>
</html>
