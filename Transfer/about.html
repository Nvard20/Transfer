<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arev Transfer</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-layout="public" data-page="about" data-title="aboutTitle" data-nav="about">
    <main>
        <section class="page-head">
            <div class="container">
                <h1 data-i18n="aboutTitle"></h1>
                <p class="lead" data-i18n="aboutLead"></p>
            </div>
        </section>

        <section class="section">
            <div class="container about-grid">
                <div class="prose">
                    <h2 data-i18n="aboutMissionTitle"></h2>
                    <p data-i18n="aboutMissionText"></p>
                    <h2 data-i18n="aboutWhyTitle"></h2>
                    <ul>
                        <li data-i18n="aboutWhy1"></li>
                        <li data-i18n="aboutWhy2"></li>
                        <li data-i18n="aboutWhy3"></li>
                        <li data-i18n="aboutWhy4"></li>
                    </ul>
                </div>
                <div class="stats-grid">
                    <div class="card stat"><strong>24/7</strong><span data-i18n="statSupport"></span></div>
                    <div class="card stat"><strong>2</strong><span data-i18n="statAirports"></span></div>
                    <div class="card stat"><strong>60+</strong><span data-i18n="statHotels"></span></div>
                    <div class="card stat"><strong>4.9</strong><span data-i18n="statRating"></span></div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
